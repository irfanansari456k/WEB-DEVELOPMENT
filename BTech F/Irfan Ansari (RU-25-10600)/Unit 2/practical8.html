<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors Example</title>

    <style>
        /* Universal Selector */
        * {
            font-family: Arial;
        }

        /* ID Selector */
        #main {
            background-color: lightblue;
            padding: 15px;
        }

        /* Class Selector */
        .highlight {
            color: red;
            font-weight: bold;
        }

        /* Descendant Selector */
        div p {
            color: green;
        }

        /* Group Selector */
        h1, h2, h3 {
            text-align: center;
            color: blue;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <div id="main">
        <p>This paragraph is inside div.</p>
        <p class="highlight">This is class selector example.</p>
    </div>

    <p>This paragraph is outside div.</p>

    <h2>Group Selector Example</h2>
    <h3>Universal Selector Applied</h3>

</body>
</html>
