<!DOCTYPE html>
<html>
<head>
    <title>CSS in One File</title>

    <style>
        body {
            background-image: url("https://via.placeholder.com/800");
            background-size: cover;
            font-family: Arial;
        }

        h1 {
            text-align: center;
            color: white;
        }

        .box {
            width: 300px;
            background-color: lightblue;

            /* Box Model */
            padding: 20px;
            margin: 50px auto;
            border: 4px solid darkblue;

            text-align: center;
        }

        .content {
            background-color: white;
            padding: 10px;
            border: 2px dashed red;
        }
    </style>
</head>

<body>

    <h1>Advanced CSS Example</h1>

    <div class="box">
        <h2>Box Model</h2>
        <div class="content">
            This example shows margin, padding, border and background image.
        </div>
    </div>

</body>
</html>
