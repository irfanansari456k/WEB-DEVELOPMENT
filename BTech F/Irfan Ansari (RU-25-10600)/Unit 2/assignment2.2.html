<!DOCTYPE html>
<html>
<head>
    <title>Responsive Layout</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Header */
        header {
            background: #007BFF;
            color: white;
            padding: 15px;
            text-align: center;
        }

        /* Layout using Flexbox */
        .container {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 25%;
            background: #f4f4f4;
            padding: 15px;
        }

        /* Content */
        .content {
            width: 75%;
            padding: 15px;
            background: #eaeaea;
        }

        /* Float example */
        .box {
            float: left;
            width: 50%;
            padding: 10px;
            background: #ccc;
            border: 1px solid #999;
        }

        .clear {
            clear: both;
        }

        /* -------- Media Queries -------- */

        /* Less than 600px (Mobile) */
        @media (max-width: 599px) {
            .container {
                flex-direction: column;
            }

            .sidebar, .content {
                width: 100%;
            }

            .box {
                width: 100%;
            }
        }

        /* 600px to 900px (Tablet) */
        @media (min-width: 600px) and (max-width: 900px) {
            .sidebar {
                width: 35%;
            }

            .content {
                width: 65%;
            }
        }

        /* Greater than 900px (Desktop) */
        @media (min-width: 901px) {
            .sidebar {
                width: 25%;
            }

            .content {
                width: 75%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>Responsive Web Layout</h2>
    </header>

    <div class="container">

        <div class="sidebar">
            <h3>Sidebar</h3>
            <p>Navigation links</p>
        </div>

        <div class="content">
            <h3>Main Content</h3>
            <p>This is the content area.</p>

            <div class="box">Float Box 1</div>
            <div class="box">Float Box 2</div>
            <div class="clear"></div>
        </div>

    </div>

</body>
</html>
