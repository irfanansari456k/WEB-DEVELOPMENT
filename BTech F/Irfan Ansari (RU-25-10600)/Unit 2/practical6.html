<!DOCTYPE html>
<html>
<head>
    <title>CSS Types Example</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="practical6.css">

    <!-- Internal CSS -->
    <style>
        h2 {
            color: blue;
            text-align: center;
        }

        .internal {
            background-color: lightyellow;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h1 style="color:red; text-align:center;">
        Inline CSS Example
    </h1>

    <p style="font-size:18px; color:green;">
        This paragraph uses inline CSS.
    </p>

    <h2>Internal CSS Example</h2>

    <p class="internal">
        This paragraph is styled using internal CSS.
    </p>

    <h3 class="external">
        External CSS Example
    </h3>

    <p class="external">
        This paragraph is styled using external CSS.
    </p>

</body>
</html>
