<!DOCTYPE html>
<html>
<head>
    <title>HTML Attributes Example</title>
</head>
<body>

    <h2 id="heading">Use of Attributes in HTML</h2>

    <!-- Anchor tag with href attribute -->
    <p>
        <a href="https://www.google.com">Go to Google</a>
    </p>

    <!-- Image tag with src and alt attributes -->
    <img src="image2.jpg" alt="Sample Image" width="200">

    <!-- Paragraph with id attribute -->
    <p id="para1">
        This paragraph uses the id attribute.
    </p>

</body>
</html>
