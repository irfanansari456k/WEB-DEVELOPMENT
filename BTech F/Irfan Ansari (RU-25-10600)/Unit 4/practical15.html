<!DOCTYPE html>
<html>
<head>
    <title>DOM Manipulation Example</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background-color: #f2f2f2;
        }

        .box {
            background-color: white;
            border: 2px solid black;
            padding: 20px;
            margin: 20px auto;
            width: 400px;
            text-align: center;
        }

        button {
            margin: 5px;
            padding: 5px 10px;
        }
    </style>

    <script>
        // Change content using getElementById()
        function changeById() {
            document.getElementById("demoId").innerHTML = "Content changed using getElementById()";
        }

        // Change content using querySelector()
        function changeByQuery() {
            document.querySelector(".demoClass").innerHTML = "Content changed using querySelector()";
        }

        // Append content
        function appendContent() {
            document.getElementById("demoId").innerHTML += " (Appended Text)";
        }
    </script>
</head>

<body>

    <div class="box">
        <h2>DOM Manipulation Demo</h2>

        <p id="demoId">This is a paragraph with ID.</p>
        <p class="demoClass">This is a paragraph with class.</p>

        <button onclick="changeById()">Change by ID</button>
        <button onclick="changeByQuery()">Change by QuerySelector</button>
        <button onclick="appendContent()">Append Content</button>
    </div>

</body>
</html>
