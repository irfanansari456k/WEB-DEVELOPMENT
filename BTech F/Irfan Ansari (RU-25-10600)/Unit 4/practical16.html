<!DOCTYPE html>
<html>
<head>
    <title>Show/Hide & Toggle Class Example</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background-color: #f2f2f2;
        }

        .box {
            background-color: white;
            border: 2px solid black;
            padding: 20px;
            margin: 20px auto;
            width: 400px;
            text-align: center;
        }

        .highlight {
            color: red;
            font-weight: bold;
            font-size: 18px;
        }

        .hidden {
            display: none;
        }

        button {
            margin: 5px;
            padding: 5px 10px;
        }
    </style>

    <script>
        // Show or hide element
        function toggleVisibility() {
            var elem = document.getElementById("myText");
            if(elem.style.display === "none") {
                elem.style.display = "block";
            } else {
                elem.style.display = "none";
            }
        }

        // Toggle CSS class
        function toggleHighlight() {
            var elem = document.getElementById("myText");
            elem.classList.toggle("highlight");
        }
    </script>
</head>

<body>

    <div class="box">
        <h2>Show/Hide & Toggle Class Demo</h2>

        <p id="myText">This text can be shown/hidden or highlighted.</p>

        <button onclick="toggleVisibility()">Show / Hide</button>
        <button onclick="toggleHighlight()">Toggle Highlight</button>
    </div>

</body>
</html>
